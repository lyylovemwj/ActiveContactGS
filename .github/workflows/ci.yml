name: ci

on:
  push:
  pull_request:

jobs:
  cpu-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile and collect tests
        run: |
          python -m compileall -q src scripts
          python -m pytest --collect-only -q
      - name: Repository policy check
        run: python scripts/verify_repository.py
      - name: Import check
        run: python -c "import torch, active_contact_gs; print(torch.__version__)"
